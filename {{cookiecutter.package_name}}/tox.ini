[tox]
env_list =
    lint
{%- if cookiecutter.use_mypy %}
    type
{%- endif %}
{%- if cookiecutter.use_security %}
    security
{%- endif %}
{%- if cookiecutter.use_pytest %}
    py{310,311,312}
{%- endif %}

{%- if cookiecutter.use_pytest %}
[testenv]
description = run tests
deps =
    pytest
commands =
    pytest {posargs:tests}
{%- endif %}

[testenv:lint]
description = format and lint
skip_install = true
deps =
    ruff
commands =
    ruff format .
    ruff check --fix .

{%- if cookiecutter.use_pytest %}
[testenv:type]
description = run type check
skip_install = true
deps =
    mypy
commands =
    mypy --install-types --non-interactive --ignore-missing-imports {{ cookiecutter.project_slug }}{% if cookiecutter.use_pytest %} tests/{% endif %}
{%- endif %}

{%- if cookiecutter.use_security %}
[testenv:security]
description = run security check
skip_install = true
deps =
    bandit
    pip-audit
commands =
    bandit {{ cookiecutter.project_slug }}/
    pip-audit
{%- endif %}

{%- if cookiecutter.use_pytest %}
[testenv:py310]
basepython = python3.10

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12
{%- if cookiecutter.use_codecov %}
description = Run tests and code coverage
passenv = *
deps =
    codecov
    pytest
    pytest-cov
commands =
    pytest --cov=./ --cov-append --cov-report=xml {poeargs:tests}
    codecov -e TOXENV
{%- endif %}
{%- endif %}

[gh-actions]
python =
{%- if cookiecutter.use_pytest %}
    3.10: py310
    3.11: py311
{%- endif %}
    3.12: lint{%- if cookiecutter.use_mypy %}, type{%- endif %}{%- if cookiecutter.use_pytest %}, py312{%- endif %}{%- if cookiecutter.use_security %}, security{%- endif %}
